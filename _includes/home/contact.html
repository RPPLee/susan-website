<section class="contact" id="contact">
  <div class="container">
    <div class="contact-content">
      <h2 class="section-title">{{ include.block.heading | escape }}</h2>
      {% if include.block.text %}<p>{{ include.block.text | escape }}</p>{% endif %}
      <div class="contact-links">
        <a href="{{ '/contact/' | relative_url }}" class="contact-link">
          <i class="fas fa-paper-plane"></i>
          <span>Send a Message</span>
        </a>
        {% if site.data.settings.social.linkedin %}
        <a href="{{ site.data.settings.social.linkedin }}" target="_blank" rel="noopener" class="contact-link">
          <i class="fab fa-linkedin"></i>
          <span>LinkedIn</span>
        </a>
        {% endif %}
        {% if site.data.settings.social.substack %}
        <a href="{{ site.data.settings.social.substack }}" target="_blank" rel="noopener" class="contact-link">
          {% include substack-icon.html %}
          <span>Substack</span>
        </a>
        {% endif %}
      </div>
    </div>
  </div>
</section>
