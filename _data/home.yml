sections:
  - type: hero
    heading: " The Journey from Idea to Impact"
    tagline: "Personal Coaching and Business Management Consulting "
    text: Metaphase Management Associates guides individuals and teams to define and
      build a  balanced , practical and purpose focused path forward by blending
      personal, business and spiritual considerations.
    buttons:
      - label: Explore Services
        url: /#services
        style: primary
      - label: New Programs
        url: /programs/
        style: secondary
  - type: call
    eyebrow: Receive Your Free Hour
    heading: Conversation With An OG
    text: A free hour conversation, questions and dialog, for people under 40 and
      anyone else navigating these complex times.
    points:
      - 60 minutes, one-on-one
      - In person, by phone or by video
      - Free
    button_label: Schedule a time
    more_label: What the conversation is
    more_url: /services/conversation-with-an-og/
  - type: services
    heading: Our Services
    text: We guide and support clients as they move through confusing complexity
      into  a clearer sense of future directions built upon the integrated
      wisdom of their personal, business and spiritual strengths
  - type: posts
    eyebrow: Tips
    heading: Finding insight
    text: These tools, exercises and suggestions are aids that help make sense of a
      moment.  Their use can reveal perspectives beyond being stuck in the
      polarity of either-or choices into a recognition of underlying shared
      interests and potential solutions
    count: 3
    button_label: Tap Into Insights
  - type: testimonials
    heading: What Clients Say
  - type: about
    heading: Meet Susan Mills
    image: /assets/images/susan-profile-1.jpg
    text: >-
      Susan Mills is a skilled companion steeped in helping individuals,
      business entrepreneurs and community initiatives thrive as they blend
      personally rewarding and financially practical paths forward. 


      Susan has decades of success helping large and small clients develop
      competitive advantage and beome industry leaders.  With this has come
      Susan's first-hand understanding of the dispiriting human costs of
      pursuing financial performance only.  


      Today, Susan's counsel incorporates considerations for
      interconnections.  She  helps clients build vitality through
      multi-dimensional reflection and assessment, collaborations, networks,
      reciprocity, financial flows and creative diversity.  It has taken a few
      life lessons to understand this deeply!


      Susan specializes in transforming solo performance into teamwork and
      shared value.  Finding  joy and insight  during the  slog through tough
      and confusing times creates sustained rewards. 
    button_label: Learn More
    button_url: /about/
  - type: contact
    heading: Let's Work Together
    text: Ready to navigate your next transition? Whether you're looking for your
      career's next step, a startup founder, community leader, or organization
      in need of guidance through these times, we'd love to hear from you.
