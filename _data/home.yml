sections:
  - type: hero
    heading: Journey from Idea to Impact
    tagline: "Personal Coaching and Business Management Consulting "
    text: Build a balanced, practical and purpose focused path forward by blending
      personal, business and spiritual considerations.
    buttons:
      - label: Explore Services
        url: /#services
        style: primary
  - type: call
    eyebrow: Receive Your Free Hour
    heading: Conversation With An OG
    text: A free hour conversation, questions and dialog, for people under 40 and
      anyone else navigating these complex times.
    button_label: Request a time
    more_url: /services/conversation-with-an-og/
  - type: services
    heading: Our Services
  - type: testimonials
    heading: What Clients Say
  - type: about
    heading: About Metaphase Management
    image: /assets/images/susan-profile-1.jpg
    caption: Susan Mills, Founder & CEO
    text: >-
      Metaphase Management helps individuals, businesses and communities
      navigate the journey from idea to meaningful impact. We coach
      individuals and design leadership programs, team building, business
      models and operations that balance personal, business, community,
      spiritual and environmental considerations, because competitive
      cultures alone lead to burnout, and we are stronger together than
      alone.


      Founder Susan Mills has, over four decades, guided more than 200
      companies and programs from first idea through growth and market
      leadership, and along the way saw the human cost of pursuing financial
      performance only. That experience shapes every engagement.
    button_label: Learn More
    button_url: /about/
  - type: contact
    heading: Let's Work Together
    text: Ready to navigate your next transition? Whether you're looking for your
      career's next step, a startup founder, community leader, or organization
      in need of guidance through these times, we'd love to hear from you.
