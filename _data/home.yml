  - type: about
    heading: About Metaphase Management
    image: /assets/images/susan-profile-1.jpg
    caption: Susan Mills, Founder & CEO
    text: >-
      Metaphase Management helps individuals, businesses and communities
      navigate the path from idea to impact. We coach individuals and companies
      to define clear direction, design  and develop leadership , build teams,
      consider new types of business models and use new tools to track  and
      report operations.   


      People are our focus, especially at times of transition such as promotion,
      retirement or peer-level shifts, company redesign, job or role
      elimination, succession planning, and functional team collaborations.  We
      work with board members and management to align expectations and
      directions. 


      We emphasize processes not to-do lists . We encourage approaches  that
      balance personal, business, community, inspirational and environmental
      considerations. Understanding that a culture focused on competitive
      financial performance alone leads to burnout, we incorporate additional
      factors of wellbeing in setting goald for successful performance. 


      Founder Susan Mills has, over four decades, guided more than 200 companies
      and programs from first idea through growth and market leadership, and
      along the way saw the human cost of pursuing financial performance only.
      That experience shapes every engagement.
    button_label: Learn More
    button_url: /about/
  - type: contact
    heading: Let's Work Together
    text: Ready to navigate your next transition? Whether you're looking for your
      career's next step, or you are a startup founder, community leader, or
      organization in need of guidance through these times, we'd love to hear
      from you.
