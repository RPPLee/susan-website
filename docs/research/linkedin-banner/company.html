<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,500;0,800;1,600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; }
  body { width: 1512px; height: 256px; overflow: hidden; font-family: 'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  .banner { position: relative; width: 1512px; height: 256px; overflow: hidden;
    background: linear-gradient(178deg, #0a2d2f 0%, #0a2d2f 30%, #0f4f58 75%, #1A8292 140%); }
  .banner.light { background: linear-gradient(105deg, #fbfcfc 0%, #f6f9f8 50%, #eaf3f3 100%); }
  .dots { position: absolute; inset: 0;
    background-image: radial-gradient(rgba(208,133,41,0.55) 1.3px, transparent 1.6px);
    background-size: 20px 20px; background-position: 10px 10px;
    -webkit-mask-image: linear-gradient(90deg, transparent 62%, rgba(0,0,0,0.7) 84%, #000 100%); }
  .light .dots { background-image: radial-gradient(rgba(26,130,146,0.35) 1.3px, transparent 1.6px); }
  .logo { position: absolute; top: 34px; right: 44px; display: flex; align-items: center; gap: 12px; }
  .logo img { height: 40px; }
  .wordmark { display: flex; flex-direction: column; color: #F5F1E8; }
  .light .wordmark { color: #0A2D2F; }
  .wordmark b { font-weight: 800; font-size: 17px; letter-spacing: 0.16em; line-height: 1; }
  .wordmark span { font-weight: 500; font-size: 7.5px; letter-spacing: 0.2em; margin-top: 4px; }
  /* LinkedIn's logo tile covers the lower left, so the text starts at 333px (op-064). */
  .text { position: absolute; left: 333px; top: 62px; }
  .kicker { color: #D08529; font-weight: 500; font-size: 14px; letter-spacing: 0.3em; text-transform: uppercase; margin: 0 0 8px 2px; }
  h1 { margin: 0; color: #F5F1E8; font-weight: 800; font-size: 60px; line-height: 1; letter-spacing: -0.01em; white-space: nowrap; }
  h1 em { font-style: italic; font-weight: 600; color: #D08529; font-size: 52px; margin: 0 8px; }
  .light h1 { color: #0A2D2F; }
  .rule { width: 190px; height: 4px; background: #D08529; margin: 12px 0 14px; }
  .line { color: rgba(245,241,232,0.88); font-weight: 500; font-size: 16px; margin: 0; }
  .light .line { color: #0A2D2F; }
  .line i { color: #D08529; font-style: normal; margin: 0 8px; }
</style></head>
<body><div class="banner VARIANT"><div class="dots"></div>
  <div class="logo"><img src="logo-graphic.svg" alt=""><div class="wordmark"><b>METAPHASE</b><span>MANAGEMENT ASSOCIATES</span></div></div>
  <div class="text">
    <p class="kicker">From</p>
    <h1>IDEA <em>to</em> IMPACT</h1>
    <div class="rule"></div>
    <p class="line">Strategic Management &amp; Business Consulting<i>•</i>Berkeley, California<i>•</i>metaphasemgt.com</p>
  </div>
</div></body></html>
