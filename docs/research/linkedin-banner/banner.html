<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,500;0,800;1,600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; }
  body { width: 1584px; height: 396px; overflow: hidden; font-family: 'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  .banner { position: relative; width: 1584px; height: 396px; overflow: hidden;
    background: linear-gradient(105deg, #1A8292 -8%, #0f4f58 36%, #0a2d2f 72%, #0a2d2f 100%); }
  .banner.light { background: linear-gradient(105deg, #fbfcfc 0%, #f6f9f8 50%, #eaf3f3 100%); }
  .dots { position: absolute; inset: 0;
    background-image: radial-gradient(rgba(208,133,41,0.55) 1.3px, transparent 1.6px);
    background-size: 22px 22px; background-position: 11px 11px;
    -webkit-mask-image: linear-gradient(90deg, transparent 58%, rgba(0,0,0,0.7) 82%, #000 100%); }
  .light .dots { background-image: radial-gradient(rgba(26,130,146,0.35) 1.3px, transparent 1.6px); }
  .logo { position: absolute; top: 40px; right: 24px; height: 80px; }
  .text { position: absolute; left: 490px; top: 0; height: 396px; display: flex; flex-direction: column; justify-content: center; }
  .kicker { color: #D08529; font-weight: 500; font-size: 22px; letter-spacing: 0.34em; text-transform: uppercase; margin: 0 0 14px 4px; }
  h1 { margin: 0; color: #F5F1E8; font-weight: 800; font-size: 118px; line-height: 1; letter-spacing: -0.01em; white-space: nowrap; }
  h1 em { font-style: italic; font-weight: 600; color: #D08529; font-size: 100px; margin: 0 10px; }
  .light h1 { color: #0A2D2F; }
</style></head>
<body><div class="banner VARIANT"><div class="dots"></div>
  <img class="logo" src="logo-VARIANT.png" alt="">
  <div class="text">
    <p class="kicker">Navigate the journey from</p>
    <h1>IDEA <em>to</em> IMPACT</h1>
  </div>
</div></body></html>
