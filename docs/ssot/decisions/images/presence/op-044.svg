<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 442 388" width="100%" role="img" aria-label="Feed to Insights data">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--ground-2, #EFECDF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Feed to Insights data</text><line class="dg-edge" x1="205.5" y1="72" x2="229.5" y2="72" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="273.3" y1="100" x2="200.2" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="216" y1="164" x2="240" y2="162.6" marker-end="url(#dg-arrow)"/><rect x="203.5" y="154.3" width="49" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="228" y="167.3" text-anchor="middle">Jekyll</text><line class="dg-edge" x1="310.1" y1="100" x2="240.1" y2="236" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="22.5" y="44" width="183" height="56" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="114" y="62" text-anchor="middle">metaphase.substack.com</text><text x="114" y="80" text-anchor="middle">/feed</text><rect class="dg-box" x="229.5" y="44" width="190" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="324.5" y="62" text-anchor="middle">Script: newest 10,</text><text x="324.5" y="80" text-anchor="middle">title date link excerpt</text><rect class="dg-box" x="82" y="140" width="134" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="149" y="158" text-anchor="middle">Data file</text><text x="149" y="176" text-anchor="middle">(not committed)</text><rect class="dg-box" x="240" y="140" width="120" height="38" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="300" y="158" text-anchor="middle">Insights page</text><rect class="dg-box" x="115.5" y="236" width="211" height="74" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="221" y="254" text-anchor="middle">Feed down or file missing:</text><text x="221" y="272" text-anchor="middle">build passes, page says</text><text x="221" y="290" text-anchor="middle">posts are on Substack</text><rect class="dg-ex" x="16" y="326" width="410" height="50" rx="8"/><text class="dg-sub" x="28" y="348">Every push and daily at 06:00 Pacific (13:00 UTC).</text><text class="dg-sub" x="28" y="366">Excerpt: the feed description trimmed to about 200 characters.</text></svg>
