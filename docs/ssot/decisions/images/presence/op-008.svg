<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 423 292" width="100%" role="img" aria-label="Checkout or invoice">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--ground-2, #EFECDF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Checkout or invoice</text><line class="dg-edge" x1="130.4" y1="118" x2="137.5" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="293.6" y1="118" x2="289.1" y2="140" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="41" y="44" width="155" height="74" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="118.5" y="62" text-anchor="middle">Fixed price:</text><text x="118.5" y="80" text-anchor="middle">programs, blitzes,</text><text x="118.5" y="98" text-anchor="middle">coaching package</text><rect class="dg-box" x="220" y="44" width="162" height="74" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="301" y="62" text-anchor="middle">Retained work:</text><text x="301" y="80" text-anchor="middle">strategic planning,</text><text x="301" y="98" text-anchor="middle">performance</text><rect class="dg-box" x="86.5" y="140" width="120" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="146.5" y="158" text-anchor="middle">Pay button</text><text x="146.5" y="176" text-anchor="middle">(Stripe link)</text><rect class="dg-box" x="230.5" y="140" width="106" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="283.5" y="158" text-anchor="middle">Quote, then</text><text x="283.5" y="176" text-anchor="middle">invoice</text><rect class="dg-ex" x="16" y="230" width="391" height="50" rx="8"/><text class="dg-sub" x="28" y="252">BizBlitz: price on the page, pay button, done.</text><text class="dg-sub" x="28" y="270">Quarterly strategic planning: conversation, quote, invoice.</text></svg>
