<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 527 274" width="100%" role="img" aria-label="One seam: the built site">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--ground-2, #EFECDF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">One seam: the built site</text><line class="dg-edge" x1="255" y1="68.2" x2="279" y2="66.6" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="308.7" y1="82" x2="237.8" y2="140" marker-end="url(#dg-arrow)"/><rect x="238.75" y="102" width="69" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="273.25" y="115" text-anchor="middle">data file</text><line class="dg-edge" x1="263.5" y1="168" x2="287.5" y2="168" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="142" y="44" width="113" height="56" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="198.5" y="62" text-anchor="middle">Fixture feed</text><text x="198.5" y="80" text-anchor="middle">and data</text><rect class="dg-box" x="279" y="44" width="106" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="332" y="62" text-anchor="middle">Feed script</text><rect class="dg-box" x="143.5" y="140" width="120" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="203.5" y="158" text-anchor="middle">Jekyll build</text><text x="203.5" y="176" text-anchor="middle">(temp folder)</text><rect class="dg-box" x="287.5" y="140" width="96" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="335.5" y="158" text-anchor="middle">Assert on</text><text x="335.5" y="176" text-anchor="middle">the HTML</text><rect class="dg-ex" x="16" y="212" width="495" height="50" rx="8"/><text class="dg-sub" x="28" y="234">Runs with node --test locally and in the workflow before deploy.</text><text class="dg-sub" x="28" y="252">Example: fixture with 12 posts, Insights page shows 10 with Substack links.</text></svg>
