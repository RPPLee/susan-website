<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 387 274" width="100%" role="img" aria-label="Go ahead, then report">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--ground-2, #EFECDF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Go ahead, then report</text><line class="dg-edge" x1="98.2" y1="100" x2="109.8" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="276.4" y1="100" x2="272.1" y2="140" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="16" y="44" width="148" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="90" y="62" text-anchor="middle">Change in an</text><text x="90" y="80" text-anchor="middle">approved category</text><rect class="dg-box" x="188" y="44" width="183" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="279.5" y="62" text-anchor="middle">Copy in Susan&#39;s voice,</text><text x="279.5" y="80" text-anchor="middle">prices, irreversible</text><rect class="dg-box" x="54.5" y="140" width="127" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="118" y="158" text-anchor="middle">Agent does it,</text><text x="118" y="176" text-anchor="middle">reports after</text><rect class="dg-box" x="205.5" y="140" width="127" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="269" y="158" text-anchor="middle">Lee or Susan</text><text x="269" y="176" text-anchor="middle">says yes first</text><rect class="dg-ex" x="16" y="212" width="355" height="50" rx="8"/><text class="dg-sub" x="28" y="234">Upload a banner: do it, report.</text><text class="dg-sub" x="28" y="252">Rewrite her About section: draft first.</text></svg>
