<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 468 448" width="100%" role="img" aria-label="Approval before any account change">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--ground-2, #EFECDF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Approval before any account change</text><line class="dg-edge" x1="234" y1="100" x2="234" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="212" y1="196" x2="180.5" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="251.5" y1="196" x2="276.5" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="163.6" y1="274" x2="157.8" y2="332" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="299" y1="292" x2="306.1" y2="332" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="177.5" y="44" width="113" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="234" y="62" text-anchor="middle">Agent drafts</text><text x="234" y="80" text-anchor="middle">the change</text><rect class="dg-box" x="163.5" y="140" width="141" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="234" y="158" text-anchor="middle">Card on the page</text><text x="234" y="176" text-anchor="middle">with picture</text><rect class="dg-box" x="117.5" y="236" width="96" height="38" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="165.5" y="254" text-anchor="middle">Lee: yes</text><rect class="dg-box" x="237.5" y="236" width="113" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="294" y="254" text-anchor="middle">Lee: not yet</text><text x="294" y="272" text-anchor="middle">or ask Susan</text><rect class="dg-box" x="91.5" y="332" width="127" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="155" y="350" text-anchor="middle">Change made</text><text x="155" y="368" text-anchor="middle">in the account</text><rect class="dg-box" x="242.5" y="332" width="134" height="38" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="309.5" y="350" text-anchor="middle">Nothing changes</text><rect class="dg-ex" x="16" y="404" width="436" height="32" rx="8"/><text class="dg-sub" x="28" y="426">Banner upload: drafted 09-12, card 09-12, yes 09-14, upload after.</text></svg>
