<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 359 274" width="100%" role="img" aria-label="The Stripe email">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--ground-2, #EFECDF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">The Stripe email</text><line class="dg-edge" x1="199" y1="72" x2="223" y2="72" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="223" y1="98.6" x2="129.4" y2="140" marker-end="url(#dg-arrow)"/><rect x="148.2" y="110.3" width="56" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="176.2" y="123.3" text-anchor="middle">ignored</text><line class="dg-edge" x1="150.5" y1="100" x2="212" y2="140" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="16" y="44" width="183" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="107.5" y="62" text-anchor="middle">Substack creates</text><text x="107.5" y="80" text-anchor="middle">Susan&#39;s Stripe account</text><rect class="dg-box" x="223" y="44" width="120" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="283" y="62" text-anchor="middle">Stripe emails</text><text x="283" y="80" text-anchor="middle">Susan</text><rect class="dg-box" x="23" y="140" width="127" height="38" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="86.5" y="158" text-anchor="middle">Nobody replies</text><rect class="dg-box" x="174" y="140" width="162" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="255" y="158" text-anchor="middle">Paid plans keep</text><text x="255" y="176" text-anchor="middle">charging through it</text><rect class="dg-ex" x="16" y="212" width="327" height="50" rx="8"/><text class="dg-sub" x="28" y="234">Plans stay $8 a month, $80 a year, $240 founding.</text><text class="dg-sub" x="28" y="252">No call, no reply, nothing to set up.</text></svg>
