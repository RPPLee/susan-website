<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 416 274" width="100%" role="img" aria-label="Three income streams online">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--ground-2, #EFECDF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Three income streams online</text><line class="dg-edge" x1="90.4" y1="100" x2="111.1" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="240.6" y1="100" x2="269.9" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="334.1" y1="100" x2="308.4" y2="140" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="16" y="44" width="120" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="76" y="62" text-anchor="middle">Substack</text><text x="76" y="80" text-anchor="middle">subscriptions</text><rect class="dg-box" x="160" y="44" width="120" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="220" y="62" text-anchor="middle">Program</text><text x="220" y="80" text-anchor="middle">registrations</text><rect class="dg-box" x="304" y="44" width="96" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="352" y="62" text-anchor="middle">Coaching</text><text x="352" y="80" text-anchor="middle">packages</text><rect class="dg-box" x="55" y="140" width="141" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="125.5" y="158" text-anchor="middle">Stripe account 1</text><text x="125.5" y="176" text-anchor="middle">(Substack)</text><rect class="dg-box" x="220" y="140" width="141" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="290.5" y="158" text-anchor="middle">Stripe account 2</text><text x="290.5" y="176" text-anchor="middle">(Metaphase)</text><rect class="dg-ex" x="16" y="212" width="384" height="50" rx="8"/><text class="dg-sub" x="28" y="234">$8 a month or $80 a year for readers.</text><text class="dg-sub" x="28" y="252">$500 for four coaching sessions; program price per flyer.</text></svg>
