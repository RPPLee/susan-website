<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 544" width="100%" role="img" aria-label="A save becomes a live page">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--ground-2, #EFECDF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">A save becomes a live page</text><line class="dg-edge" x1="205" y1="100" x2="205" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="205" y1="196" x2="205" y2="236" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="205" y1="292" x2="205" y2="332" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="205" y1="370" x2="205" y2="428" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="141.5" y="44" width="127" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="205" y="62" text-anchor="middle">Susan signs in</text><text x="205" y="80" text-anchor="middle">by email link</text><rect class="dg-box" x="134.5" y="140" width="141" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="205" y="158" text-anchor="middle">Edits a field or</text><text x="205" y="176" text-anchor="middle">the page text</text><rect class="dg-box" x="148.5" y="236" width="113" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="205" y="254" text-anchor="middle">Save: commit</text><text x="205" y="272" text-anchor="middle">to the repo</text><rect class="dg-box" x="145" y="332" width="120" height="38" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="205" y="350" text-anchor="middle">Site rebuilds</text><rect class="dg-box" x="134.5" y="428" width="141" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="205" y="446" text-anchor="middle">Live on</text><text x="205" y="464" text-anchor="middle">metaphasemgt.com</text><rect class="dg-ex" x="16" y="500" width="378" height="32" rx="8"/><text class="dg-sub" x="28" y="522">Change a price, press Save: live in about 1 to 3 minutes.</text></svg>
