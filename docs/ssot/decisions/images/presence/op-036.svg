<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 565 375" width="100%" role="img" aria-label="A post reaches the Insights page">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--ground-2, #EFECDF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">A post reaches the Insights page</text><line class="dg-axis" x1="30" y1="50" x2="30" y2="262"/><circle cx="30" cy="50" r="7" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)" stroke-width="2"/><text x="50" y="55" font-weight="700">Day 1, 10:00</text><text class="dg-sub" x="50" y="73">Susan publishes on Substack</text><circle cx="30" cy="103" r="7" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)" stroke-width="2"/><text x="50" y="108" font-weight="700">Day 2, 06:00</text><text class="dg-sub" x="50" y="126">Scheduled Actions run starts</text><circle cx="30" cy="156" r="7" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)" stroke-width="2"/><text x="50" y="161" font-weight="700">06:00</text><text class="dg-sub" x="50" y="179">Step downloads metaphase.substack.com/feed into a data file</text><circle cx="30" cy="209" r="7" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)" stroke-width="2"/><text x="50" y="214" font-weight="700">06:01</text><text class="dg-sub" x="50" y="232">Jekyll builds the Insights page from the file</text><circle cx="30" cy="262" r="7" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)" stroke-width="2"/><text x="50" y="267" font-weight="700">06:03</text><text class="dg-sub" x="50" y="285">Site deployed, post visible</text><rect class="dg-ex" x="16" y="313" width="533" height="50" rx="8"/><text class="dg-sub" x="28" y="335">Longest wait: just under 24 hours. Nothing committed, nothing for Susan to press.</text><text class="dg-sub" x="28" y="353">Susan&#39;s editor saves are commits, so the schedule never pauses.</text></svg>
