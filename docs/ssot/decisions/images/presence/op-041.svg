<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 481 274" width="100%" role="img" aria-label="Copy in Susan&#39;s voice">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--ground-2, #EFECDF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Copy in Susan&#39;s voice</text><line class="dg-edge" x1="214.5" y1="66.5" x2="238.5" y2="67.8" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="281.4" y1="100" x2="222.1" y2="140" marker-end="url(#dg-arrow)"/><rect x="230.25" y="111" width="43" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="251.75" y="124" text-anchor="middle">draft</text><line class="dg-edge" x1="244" y1="163.8" x2="268" y2="162.2" marker-end="url(#dg-arrow)"/><rect x="238" y="154" width="36" height="18" rx="4" fill="var(--ground, #F8F6EB)"/><text class="dg-muted" x="256" y="167" text-anchor="middle">save</text><rect class="dg-box" x="73.5" y="44" width="141" height="38" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="144" y="62" text-anchor="middle">Profile document</text><rect class="dg-box" x="238.5" y="44" width="169" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="323" y="62" text-anchor="middle">Lee drafts hero line</text><text x="323" y="80" text-anchor="middle">and About</text><rect class="dg-box" x="117" y="140" width="127" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="180.5" y="158" text-anchor="middle">Susan edits in</text><text x="180.5" y="176" text-anchor="middle">Pages CMS</text><rect class="dg-box" x="268" y="140" width="96" height="38" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="316" y="158" text-anchor="middle">Goes live</text><rect class="dg-ex" x="16" y="212" width="449" height="50" rx="8"/><text class="dg-sub" x="28" y="234">Two pieces: the &#39;who she works with&#39; line and the fuller About page.</text><text class="dg-sub" x="28" y="252">Nothing in her voice is published before she has read it.</text></svg>
