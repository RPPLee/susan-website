<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 548 274" width="100%" role="img" aria-label="Evolve, do not redesign">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--ground-2, #EFECDF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Evolve, do not redesign</text><line class="dg-edge" x1="236.7" y1="100" x2="183.3" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="315.4" y1="100" x2="374.6" y2="140" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="179" y="44" width="190" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="274" y="62" text-anchor="middle">Keep: brand, structure,</text><text x="274" y="80" text-anchor="middle">hero, service pages</text><rect class="dg-box" x="16" y="140" width="260" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="146" y="158" text-anchor="middle">Add: testimonials, audience line,</text><text x="146" y="176" text-anchor="middle">3 service groups</text><rect class="dg-box" x="300" y="140" width="232" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--pending, #D9730A)"/><text x="416" y="158" text-anchor="middle">Add: booking link,</text><text x="416" y="176" text-anchor="middle">newsletter signup, fuller bio</text><rect class="dg-ex" x="16" y="212" width="516" height="50" rx="8"/><text class="dg-sub" x="28" y="234">Four comparable sites: all have testimonials and a clients section.</text><text class="dg-sub" x="28" y="252">metaphasemgt.com today: none of the six additions.</text></svg>
