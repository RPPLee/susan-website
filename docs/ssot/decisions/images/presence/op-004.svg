<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 489 274" width="100%" role="img" aria-label="What Susan edits, what Lee keeps">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--ground-2, #EFECDF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">What Susan edits, what Lee keeps</text><line class="dg-edge" x1="165.5" y1="82" x2="107.5" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="192.2" y1="82" x2="215.7" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="320.3" y1="82" x2="368.7" y2="140" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="136.5" y="44" width="96" height="38" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="184.5" y="62" text-anchor="middle">Susan</text><rect class="dg-box" x="256.5" y="44" width="96" height="38" rx="8" fill="var(--ground-2, #EFECDF)" stroke="var(--muted, #8A7A8C)"/><text x="304.5" y="62" text-anchor="middle">Lee</text><rect class="dg-box" x="16" y="140" width="127" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="79.5" y="158" text-anchor="middle">Words, prices,</text><text x="79.5" y="176" text-anchor="middle">dates, photos</text><rect class="dg-box" x="167" y="140" width="120" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="227" y="158" text-anchor="middle">Testimonials,</text><text x="227" y="176" text-anchor="middle">bio, contact</text><rect class="dg-box" x="311" y="140" width="162" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="392" y="158" text-anchor="middle">Layout, navigation,</text><text x="392" y="176" text-anchor="middle">new page types</text><rect class="dg-ex" x="16" y="212" width="457" height="50" rx="8"/><text class="dg-sub" x="28" y="234">Tapestry moves to a new date: Susan edits the program page.</text><text class="dg-sub" x="28" y="252">A new Clients page: Lee builds it, Susan fills it in.</text></svg>
