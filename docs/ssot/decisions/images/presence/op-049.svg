<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 708 256" width="100%" role="img" aria-label="Verifying work in Susan&#39;s accounts">
<style>svg.dg{font-family:"Source Sans 3", "Helvetica Neue", Arial, sans-serif;font-size:13px}svg.dg .dg-title{font-family:Sansita, Georgia, serif;font-size:15px;font-weight:700;fill:var(--ink, #381633)}svg.dg text{fill:var(--ink, #381633)}svg.dg .dg-sub{fill:var(--ink-2, #5E4A5C);font-size:12px}svg.dg .dg-muted{fill:var(--muted, #8A7A8C);font-size:12px}svg.dg .dg-box{stroke-width:1.2}svg.dg .dg-edge{fill:none;stroke:var(--ink-2, #5E4A5C);stroke-width:1.4}svg.dg .dg-axis{stroke:var(--line, #DDD8C8);stroke-width:2}svg.dg .dg-ex{fill:var(--ground-2, #EFECDF);stroke:var(--line, #DDD8C8)}</style>
<defs><marker id="dg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink-2, #5E4A5C)"/></marker></defs>
<text class="dg-title" x="16" y="24">Verifying work in Susan&#39;s accounts</text><line class="dg-edge" x1="321" y1="72" x2="345" y2="72" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="385.5" y1="100" x2="322.5" y2="140" marker-end="url(#dg-arrow)"/><line class="dg-edge" x1="434.6" y1="100" x2="441.9" y2="140" marker-end="url(#dg-arrow)"/><rect class="dg-box" x="194" y="44" width="127" height="56" rx="8" fill="var(--card, #FFFFFF)" stroke="var(--line, #DDD8C8)"/><text x="257.5" y="62" text-anchor="middle">Change made in</text><text x="257.5" y="80" text-anchor="middle">the account</text><rect class="dg-box" x="345" y="44" width="169" height="56" rx="8" fill="var(--pending-soft, #FDEBD9)" stroke="var(--accent, #F78B14)"/><text x="429.5" y="62" text-anchor="middle">Checked by hand</text><text x="429.5" y="80" text-anchor="middle">against the decision</text><rect class="dg-box" x="197.5" y="140" width="162" height="56" rx="8" fill="var(--ok-soft, #DDF5F0)" stroke="var(--ok, #2FB9A6)"/><text x="278.5" y="158" text-anchor="middle">Screenshot attached</text><text x="278.5" y="176" text-anchor="middle">to the card</text><rect class="dg-box" x="383.5" y="140" width="127" height="56" rx="8" fill="var(--no-soft, #FBE1EF)" stroke="var(--no, #DC2597)"/><text x="447" y="158" text-anchor="middle">No screenshot:</text><text x="447" y="176" text-anchor="middle">not done</text><rect class="dg-ex" x="16" y="212" width="676" height="32" rx="8"/><text class="dg-sub" x="28" y="234">Example: dark banner uploaded to the profile (op-031); screenshot of the profile header goes on op-031.</text></svg>
